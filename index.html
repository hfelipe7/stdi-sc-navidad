<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado STDI</title>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #ffffff;
        }

        .header {
            background: #ffffff;
            padding: 20px;
        }

        .logo {
            max-width: 260px;
            display: block;
        }

        .container {
            background: #0d3c78;
            padding: 25px;
            border-radius: 10px;
            color: white;
            margin: 20px;
        }

        table.dataTable thead th {
            color: white !important;
            background: #0d3c78 !important;
        }

        table.dataTable {
            background: white !important;
            color: black !important;
        }

        select {
            width: 100%;
            padding: 5px;
            color: red !important; /* ← esto conserva los números visibles */
        }
    </style>
</head>

<body>

    <div class="header">
        <img src="logo.png" class="logo">
    </div>

    <div class="container">
        <h2>Listado: Coordinadores CCE, Delegados del 1-4,<br>Seguridad Electoral, Transporte y Movilidad del Voto</h2>

        <table id="tabla" class="display" style="width:100%">
            <thead>
                <tr>
                    <th>Territorio</th>
                    <th>Region</th>
                    <th>Tipo</th>
                    <th>Recinto</th>
                    <th>Colegio</th>
                    <th>Cargo</th>
                    <th>Nombre</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    Papa.parse("data.csv", {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function (results) {

            const data = results.data;
            const tbody = document.querySelector("#tabla tbody");

            // === CARGAR FILAS DEL CSV SIN ALTERAR ORDEN ===
            data.forEach(row => {
                let tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${row.Territorio || ""}</td>
                    <td>${row.Region || ""}</td>
                    <td>${row.Tipo || ""}</td>
                    <td>${row.Recinto || ""}</td>
                    <td>${row.Colegio || ""}</td>
                    <td>${row.Cargo || ""}</td>
                    <td>${row.Nombre || ""}</td>
                `;
                tbody.appendChild(tr);
            });

            // === ACTIVAR DATATABLES SIN ORDENAR AUTOMÁTICAMENTE ===
            let tabla = $('#tabla').DataTable({
                pageLength: 10,
                ordering: false,     // ← evita reordenamiento
                order: [],           // ← mantiene orden original
                language: {
                    lengthMenu: "Mostrar _MENU_ registros",
                    search: "Buscar:"
                }
            });

            // === SI SE QUITA EL FILTRO, NO REORDENAR ===
            tabla.on("search.dt", function () {
                if (!tabla.search()) {
                    tabla.order([]).draw(false);
                }
            });

        }
    });

});
</script>

</body>
</html>
