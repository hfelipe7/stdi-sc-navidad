<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado STDI</title>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <!-- Botones PDF -->
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css">
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>

    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        body { font-family: Arial; margin: 0; background: #ffffff; }

        .header { background: #ffffff; padding: 20px; text-align: left; }
        .logo { max-width: 280px; }

        .container {
            background: #0d3c78;
            padding: 25px;
            border-radius: 10px;
            color: white;
            margin: 20px;
        }

        h2 { margin-top: 0; }

        select {
            padding: 6px;
            width: 210px;
            border-radius: 4px;
        }

        .btn-red {
            background: #e74c3c;
            color: white;
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-blue {
            background: #1e70c9;
            color: white;
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        table.dataTable tbody tr:hover {
            background-color: #c7f7c1 !important;
        }

        th { color: white !important; background: #0d3c78 !important; }
    </style>
</head>

<body>

<div class="header">
    <img src="logo.png" class="logo">
</div>

<div class="container">
    <h2>Listado: Coordinadores CCE, Delegados del 1-4,<br>Seguridad Electoral, Transporte y Movilidad del Voto</h2>

    <!-- FILTROS -->
    <select id="f_territorio"><option value="">Territorio (todos)</option></select>
    <select id="f_region"><option value="">Región (todos)</option></select>
    <select id="f_recinto"><option value="">Recinto (todos)</option></select>
    <select id="f_colegio"><option value="">Colegio (todos)</option></select>
    <select id="f_cargo"><option value="">Cargo (todos)</option></select>

    <button id="btn_limpiar" class="btn-red">Limpiar filtros</button>
    <button id="btn_print" class="btn-blue">Imprimir</button>

    <br><br>

    <!-- TABLA -->
    <table id="tabla" class="display" style="width:100%">
        <thead>
            <tr>
                <th>Territorio</th>
                <th>Region</th>
                <th>Tipo</th>
                <th>Recinto</th>
                <th>Colegio</th>
                <th>Cargo</th>
                <th>Nombre</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    Papa.parse("data.csv", {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function (results) {

            let data = results.data;

            let tbody = document.querySelector("#tabla tbody");
            tbody.innerHTML = "";

            let territorios = new Set();
            let regiones = new Set();
            let recintos = new Set();
            let colegios = new Set();
            let cargos = new Set();

            data.forEach(row => {

                if (!row.Territorio) return;

                territorios.add(row.Territorio);
                regiones.add(row.Region);
                recintos.add(row.Recinto);
                colegios.add(row.Colegio);
                cargos.add(row.Cargo);

                tbody.innerHTML += `
                    <tr>
                        <td>${row.Territorio}</td>
                        <td>${row.Region}</td>
                        <td>${row.Tipo}</td>
                        <td>${row.Recinto}</td>
                        <td>${row.Colegio}</td>
                        <td>${row.Cargo}</td>
                        <td>${row.Nombre}</td>
                    </tr>`;
            });

            // Poblar selects correctamente
            function llenar(sel, datos) {
                datos.forEach(v => sel.insertAdjacentHTML("beforeend", `<option>${v}</option>`));
            }

            llenar(document.getElementById("f_territorio"), territorios);
            llenar(document.getElementById("f_region"), regiones);
            llenar(document.getElementById("f_recinto"), recintos);
            llenar(document.getElementById("f_colegio"), colegios);
            llenar(document.getElementById("f_cargo"), cargos);

            // Iniciar DataTable
            let tabla = $('#tabla').DataTable({
                pageLength: 25,
                order: [],
                lengthMenu: [10, 25, 50, 100],
                language: { url: "https://cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json" },
                dom: 'Bfrtip',
                buttons: [
                    {
                        extend: 'pdfHtml5',
                        text: 'Exportar PDF',
                        className: 'btn-blue',
                        title: 'Listado STDI'
                    }
                ]
            });

            function aplicarFiltros() {
                tabla.columns(0).search($("#f_territorio").val());
                tabla.columns(1).search($("#f_region").val());
                tabla.columns(3).search($("#f_recinto").val());
                tabla.columns(4).search($("#f_colegio").val());
                tabla.columns(5).search($("#f_cargo").val());
                tabla.draw();
            }

            $("#f_territorio, #f_region, #f_recinto, #f_colegio, #f_cargo").on("change", aplicarFiltros);

            // Limpiar filtros
            $("#btn_limpiar").click(function () {
                $("select").val("");
                tabla.search("").columns().search("").order([]).draw();
            });

            // Imprimir EXACTAMENTE lo filtrado
            $("#btn_print").click(function () {
                window.print();
            });

        }
    });
});
</script>

</body>
</html>
