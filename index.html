<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Base de datos - STDI San Cristóbal</title>

<!-- DataTables + Bootstrap -->
<link href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css" rel="stylesheet">
<link href="https://cdn.datatables.net/buttons/2.3.6/css/buttons.dataTables.min.css" rel="stylesheet">

<script src="https://code.jquery.com/jquery-3.5.1.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.print.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>

<style>
    body {
        background-color: #0A2A66;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        color: white;
    }

    .logo-container {
        width: 100%;
        text-align: left;
        padding: 15px 25px 5px 25px;
        background-color: white;
    }

    .logo-container img {
        height: 95px;
    }

    .content-box {
        margin: 20px;
        background: #0A2A66;
        padding: 25px;
        border-radius: 12px;
    }

    h1 {
        font-size: 28px;
        margin-bottom: 20px;
    }

    .filtros {
        margin-bottom: 15px;
    }

    select, button {
        padding: 8px;
        border-radius: 5px;
        border: none;
        margin-right: 8px;
    }

    button {
        cursor: pointer;
    }

    #tabla td:hover {
        background-color: #1db954 !important;
        color: white !important;
    }

    table.dataTable thead th {
        color: white !important;
    }
</style>
</head>

<body>

<!-- LOGO -->
<div class="logo-container">
    <img src="logo.png" alt="Logo STDI">
</div>

<!-- CONTENIDO -->
<div class="content-box">
    <h1>Listado: Coordinadores CCE, Delegados del 1-4, Seguridad Electoral, Transporte y Movilidad del Voto</h1>

    <div class="filtros">
        <select id="filtroTerritorio"></select>
        <select id="filtroRegion"></select>
        <select id="filtroRecinto"></select>
        <select id="filtroColegio"></select>
        <select id="filtroCargo"></select>

        <button id="btnLimpiar">Limpiar filtros</button>

        <button id="exportExcel">Exportar Excel</button>
        <button id="exportPDF">Exportar PDF</button>
        <button onclick="window.print()">Imprimir</button>
    </div>

    <table id="tabla" class="display" style="width:100%; color:white;">
        <thead>
            <tr>
                <th>Territorio</th>
                <th>Region</th>
                <th>Tipo</th>
                <th>Recinto</th>
                <th>Colegio</th>
                <th>Cargo</th>
                <th>Nombre</th>
                <th>Cédula</th>
                <th>Celular</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
$(document).ready(function () {

    $.get("data.csv", function (data) {
        let filas = data.split("\n").slice(1);
        let dataset = [];

        filas.forEach(function (fila) {
            let cols = fila.split(",");
            if (cols.length >= 9) dataset.push(cols);
        });

        let tabla = $("#tabla").DataTable({
            data: dataset,
            pageLength: 25,        // DEFAULT EN 25
            lengthMenu: [10, 25, 50, 100],
            dom: 'Bfrtip',
            buttons: [
                { extend: "excelHtml5", text: "Exportar Excel" },
                { extend: "pdfHtml5", text: "Exportar PDF" }
            ]
        });

        // LLENAR FILTROS
        function llenarFiltro(colIndex, selector) {
            let valores = [...new Set(dataset.map(row => row[colIndex]).sort())];
            $(selector).append(`<option value="">(todos)</option>`);
            valores.forEach(v => $(selector).append(`<option>${v}</option>`));
        }

        llenarFiltro(0, "#filtroTerritorio");
        llenarFiltro(1, "#filtroRegion");
        llenarFiltro(3, "#filtroRecinto");
        llenarFiltro(4, "#filtroColegio");
        llenarFiltro(5, "#filtroCargo");

        // EVENTOS DE FILTRO
        $("#filtroTerritorio").on("change", function () { tabla.column(0).search(this.value).draw(); });
        $("#filtroRegion").on("change", function () { tabla.column(1).search(this.value).draw(); });
        $("#filtroRecinto").on("change", function () { tabla.column(3).search(this.value).draw(); });
        $("#filtroColegio").on("change", function () { tabla.column(4).search(this.value).draw(); });
        $("#filtroCargo").on("change", function () { tabla.column(5).search(this.value).draw(); });

        // LIMPIAR FILTROS
        $("#btnLimpiar").click(function () {
            $("select").val("");
            tabla.search("").columns().search("").draw();
        });

    });
});
</script>
</body>
</html>
