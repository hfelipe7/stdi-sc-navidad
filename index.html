<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>STDI - Base de Datos</title>

    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #ffffff;
        }

        .header {
            background: #ffffff;
            padding: 20px;
        }

        .logo {
            max-width: 260px;
            display: block;
        }

        .container {
            background: #0d3c78; /* AZUL OSCURO */
            padding: 25px;
            border-radius: 10px;
            color: white;
            margin: 20px;
        }

        table.dataTable thead th {
            background: #0d3c78 !important;
            color: white !important;
            font-weight: bold;
        }

        table.dataTable {
            background: white !important;
            color: black !important;
        }

        tfoot select,
        tfoot input {
            width: 100%;
            padding: 4px;
        }

        /* --- ARREGLO DEL SELECT DE "MOSTRAR" --- */
        select {
            color: black !important;
        }

        /* Opciones del menú desplegable */
        select option {
            color: red !important; /* ← AHORA SE VEN PERFECTO */
            background: white !important;
        }
    </style>
</head>

<body>

<div class="header">
    <img src="logo.png" class="logo" alt="Logo STDI">
</div>

<div class="container">
    <h2>Listado: Coordinadores CCE, Delegados del 1-4,<br>
        Seguridad Electoral, Transporte y Movilidad del Voto</h2>

    <table id="tabla" class="display" style="width:100%">
        <tfoot>
          <tr id="filtros"></tr>
        </tfoot>
    </table>
</div>

<!-- JS Libraries -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
Papa.parse("data.csv", {
    download: true,
    header: true,
    complete: function(results) {

        // Crear columnas automáticamente
        let columnas = Object.keys(results.data[0]).map(col => ({
            title: col,
            data: col
        }));

        // Crear filtros en footer
        columnas.forEach(col => {
            if (col === "Territorio" || col === "Region" || col === "Recinto") {
                $("#filtros").append(`<th><select class="filtro" data-col="${col}">
                    <option value="">(todos)</option></select></th>`);
            } else {
                $("#filtros").append(`<th><input type="text" placeholder="Filtrar ${col}"></th>`);
            }
        });

        // Inicializar DataTable
        let tabla = $('#tabla').DataTable({
            data: results.data,
            columns: columnas,
            pageLength: 10,    // ← MOSTRAR 10 POR DEFECTO
            language: {
                url: "https://cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json"
            }
        });

        // Rellenar selects con valores únicos
        tabla.columns().every(function() {
            let nombreColumna = columnas[this.index()].title;

            if (["Territorio", "Region", "Recinto"].includes(nombreColumna)) {

                let select = $(`select[data-col="${nombreColumna}"]`);
                let datos = this.data().unique().sort();

                datos.each(v => {
                    if (v.trim() !== "") {
                        select.append(`<option value="${v}">${v}</option>`);
                    }
                });

                select.on("change", function() {
                    tabla.column(select.closest('th').index())
                         .search(this.value)
                         .draw();
                });
            }
        });

        // Filtros de texto normales
        tabla.columns().every(function () {
            let th = $(this.footer());
            $('input', th).on('keyup change', () => {
                this.search($('input', th).val()).draw();
            });
        });
    }
});
</script>

</body>
</html>
