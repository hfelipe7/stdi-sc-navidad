<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado STDI</title>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

    <!-- DataTables + Buttons -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css">

    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js"></script>

    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: white;
    }

    .header {
        padding: 20px;
        background: white;
        text-align: left;
    }

    .logo {
        max-width: 300px;
    }

    .container {
        background: #083b79;
        padding: 25px;
        border-radius: 10px;
        margin: 20px;
        color: white;
    }

    select {
        padding: 8px;
        border-radius: 5px;
        border: 1px solid #ccc;
        font-size: 15px;
    }

    table.dataTable tbody tr:hover {
        background-color: #b7ffbf !important;
    }

    table.dataTable thead th {
        background: #083b79 !important;
        color: white !important;
        font-size: 16px;
    }

    .dt-buttons button {
        background: #094a9b !important;
        border: none !important;
        padding: 8px 15px !important;
        border-radius: 5px !important;
        color: white !important;
        cursor: pointer;
    }

    #limpiar {
        background: #d9534f;
        border: none;
        padding: 8px 13px;
        color: white;
        border-radius: 5px;
        cursor: pointer;
        margin-left: 5px;
    }

</style>

</head>
<body>

<div class="header">
    <img src="logo.png" class="logo">
</div>

<div class="container">

<h2>Listado: Coordinadores CCE, Delegados del 1-4,<br>
Seguridad Electoral, Transporte y Movilidad del Voto</h2>

<br>

<!-- FILTROS SUPERIORES -->
<select id="f_Territorio"><option value="">Territorio (todos)</option></select>
<select id="f_Region"><option value="">Región (todos)</option></select>
<select id="f_Recinto"><option value="">Recinto (todos)</option></select>
<select id="f_Colegio"><option value="">Colegio (todos)</option></select>
<select id="f_Cargo"><option value="">Cargo (todos)</option></select>

<button id="limpiar">Limpiar filtros</button>

<br><br>

<table id="tabla" class="display" style="width:100%">
    <thead>
        <tr>
            <th>Territorio</th>
            <th>Region</th>
            <th>Tipo</th>
            <th>Recinto</th>
            <th>Colegio</th>
            <th>Cargo</th>
            <th>Nombre</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

</div>

<script>
Papa.parse("data.csv", {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {

        let cleanData = results.data.filter(row =>
            Object.values(row).some(v => v !== null && v !== "")
        );

        let columnas = Object.keys(cleanData[0]).map(col => ({
            title: col,
            data: col
        }));

        let tabla = $('#tabla').DataTable({
            data: cleanData,
            columns: columnas,
            pageLength: 10,
            order: [],
            dom: 'Bfrtip',
            buttons: [
                { extend: 'excelHtml5', text: 'Exportar Excel' },
                { extend: 'pdfHtml5', text: 'Exportar PDF' },
                { extend: 'print', text: 'Imprimir' }
            ],
            language: {
                url: "https://cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json"
            }
        });

        let filtros = ["Territorio","Region","Recinto","Colegio","Cargo"];

        filtros.forEach(campo => {
            let select = document.getElementById("f_" + campo);

            tabla.column(filtros.indexOf(campo)).data().unique().sort().each(function (d) {
                if (d && d.trim() !== "")
                    select.insertAdjacentHTML("beforeend", `<option value="${d}">${d}</option>`);
            });

            select.addEventListener("change", function () {
                tabla.column(filtros.indexOf(campo)).search(this.value).draw();
            });
        });

        document.getElementById("limpiar").addEventListener("click", function() {
            filtros.forEach(campo => {
                document.getElementById("f_" + campo).value = "";
                tabla.column(filtros.indexOf(campo)).search("");
            });
            tabla.order([]).draw();
        });

    }
});
</script>

</body>
</html>
