<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listado STDI</title>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

<!-- DataTables CSS -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css">

<!-- DataTables JS -->
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js"></script>

<!-- JSZip y PDFMake -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

<!-- PapaParse -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f4f4f4;
    }

    .header {
        background: white;
        padding: 20px;
        text-align: left;
    }

    .logo {
        max-width: 260px;
    }

    .container {
        background: #0d3c78;
        color: white;
        padding: 25px;
        border-radius: 12px;
        margin: 20px;
    }

    table.dataTable tbody tr:hover {
        background-color: #c8f7c5 !important; /* ⭐ hover verde suave */
    }

    select {
        padding: 6px;
        border-radius: 6px;
        font-size: 15px;
        color: black;
    }
</style>
</head>

<body>

<div class="header">
    <img src="logo.png" class="logo">
</div>

<div class="container">
    <h2>Listado: Coordinadores CCE, Delegados del 1-4,<br>Seguridad Electoral, Transporte y Movilidad del Voto</h2>

    <!-- FILTROS -->
    <div style="margin-bottom: 15px;">
        <select id="fltTerritorio"><option value="">Territorio (todos)</option></select>
        <select id="fltRegion"><option value="">Región (todos)</option></select>
        <select id="fltRecinto"><option value="">Recinto (todos)</option></select>
        <select id="fltColegio"><option value="">Colegio (todos)</option></select>
        <select id="fltCargo"><option value="">Cargo (todos)</option></select>

        <button id="btnClear" style="
            margin-left:10px;
            background:#ff4444;
            color:white;
            border:none;
            padding:8px 14px;
            border-radius:6px;
            cursor:pointer;">Limpiar filtros</button>
    </div>

    <!-- TABLA -->
    <table id="tabla" class="display" style="width:100%">
        <thead>
            <tr>
                <th>Territorio</th>
                <th>Region</th>
                <th>Tipo</th>
                <th>Recinto</th>
                <th>Colegio</th>
                <th>Cargo</th>
                <th>Nombre</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    Papa.parse("data.csv", {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function (results) {

            const data = results.data;

            let tabla = $('#tabla').DataTable({
                data: data,
                columns: [
                    { data: "Territorio" },
                    { data: "Region" },
                    { data: "Tipo" },
                    { data: "Recinto" },
                    { data: "Colegio" },
                    { data: "Cargo" },
                    { data: "Nombre" }
                ],
                order: [], /* ⭐ Mantener orden original */
                pageLength: 10,
                dom: 'Bfrtip',
                buttons: [
                    { extend: "excel", text: "Exportar Excel" },
                    { extend: "pdf", text: "Exportar PDF" },
                    { extend: "print", text: "Imprimir" }
                ],
                language: {
                    url: "https://cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json"
                }
            });

            /* ⭐ Poblar filtros */
            function llenarFiltro(colIndex, selectId) {
                let colData = tabla.column(colIndex).data().unique().sort();
                colData.each(v => {
                    if (v && v.trim() !== "")
                        document.getElementById(selectId)
                            .insertAdjacentHTML("beforeend", `<option value="${v}">${v}</option>`);
                });

                document.getElementById(selectId).addEventListener("change", function () {
                    tabla.column(colIndex).search(this.value).draw();
                });
            }

            llenarFiltro(0, "fltTerritorio");
            llenarFiltro(1, "fltRegion");
            llenarFiltro(3, "fltRecinto");
            llenarFiltro(4, "fltColegio");
            llenarFiltro(5, "fltCargo");

            /* ⭐ Limpiar filtros */
            document.getElementById("btnClear").onclick = function () {
                document.querySelectorAll("select").forEach(s => s.value = "");
                tabla.search("").columns().search("").order([]).draw();
            };

        }
    });

});
</script>

</body>
</html>
