<script>
    Papa.parse("data.csv", {
        download: true,
        header: true,
        skipEmptyLines: true,   // ⭐ ELIMINA FILAS VACÍAS
        complete: function(results) {

            // ⭐ LIMPIA FILAS INCOMPLETAS
            let cleanData = results.data.filter(row =>
                Object.values(row).some(v => v !== null && v !== "")
            );

            // Crear columnas automáticas
            let columnas = Object.keys(cleanData[0]).map(col => ({
                title: col,
                data: col
            }));

            // Generar selects en el footer solo para T, R, y Re
            const filtros = ["Territorio", "Region", "Recinto"];

            $("#filtros").empty();
            columnas.forEach(col => {
                if (filtros.includes(col.title)) {
                    $("#filtros").append(`<th><select id="f_${col.title}"><option value="">(todos)</option></select></th>`);
                } else {
                    $("#filtros").append(`<th></th>`);
                }
            });

            // Inicializar DataTable
            let tabla = $('#tabla').DataTable({
                data: cleanData,
                columns: columnas,
                pageLength: 10,
                language: {
                    url: "https://cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json"
                }
            });

            // Poblar selects con valores únicos
            filtros.forEach((campo, index) => {
                let select = document.getElementById("f_" + campo);

                tabla.column(index).data().unique().sort().each(function (d) {
                    if (d && d.trim() !== "")
                        select.insertAdjacentHTML("beforeend", `<option value="${d}">${d}</option>`);
                });

                select.addEventListener("change", function () {
                    tabla.column(index).search(this.value).draw();
                });
            });
        }
    });
</script>
